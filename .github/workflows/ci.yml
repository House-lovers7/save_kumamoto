name: CI

# main への push と、main を対象とする pull request で実行する。
# web (lint / build+test / audit / mobile向け生成データの乖離検知) と
# mobile (typecheck) を並列ジョブに分けている。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint / test / audit / mobile-data drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # package.json の engines は >=22.13.0。開発機は Node 24 (npm 11) で、
          # package-lock.json も npm 11 が生成している。Node 22 の npm 10 は
          # このlockを「@emnapi/* が欠落」として npm ci を拒否するため（実測: 初回CI失敗）、
          # lockを生成する開発機と同じ Node 24 (npm 11) 系に揃える。
          # lib/*.ts を直接 import するスクリプト群に必要な TypeScript type stripping も
          # Node 24 では既定で有効。
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test (build + node --test)
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check mobile-data generation drift
        run: |
          npm run gen:mobile-data
          git diff --exit-code -- apps/mobile/src/data/actions.ts

  mobile:
    name: mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
